<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acuario Designer V4</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


<!-- CABECERA -->

<header class="header">

<div class="logo">
🐠 Acuario Designer
<span>V4.0</span>
</div>


<div class="actions">

<button>Nuevo</button>
<button>Guardar</button>
<button>Exportar</button>

</div>

</header>




<!-- CUERPO -->

<div class="main">



<!-- MENU IZQUIERDO -->

<aside class="sidebar">


<h2>🛠 Herramientas</h2>


<div class="tool-grid">


<button class="tool">
🪨
<br>
Roca
</button>


<button class="tool">
🌱
<br>
Planta
</button>


<button class="tool">
🐟
<br>
Pez
</button>


<button class="tool">
💡
<br>
Luz
</button>


<button class="tool">
💧
<br>
Agua
</button>


</div>



<div class="box">

<h3>📐 Dimensiones</h3>


<label>
Largo
<input value="70">
cm
</label>


<label>
Ancho
<input value="30">
cm
</label>


<label>
Alto
<input value="40">
cm
</label>


<button class="create">
Crear acuario
</button>


</div>


</aside>





<!-- ZONA PRINCIPAL -->


<section class="viewer">


<div class="aquarium">


<div class="water"></div>


<div class="sand"></div>



<div class="decor">

</div>


</div>




<div class="camera">


<button>+</button>
<button>-</button>
<button>⟳</button>


</div>


</section>





<!-- PANEL DERECHO -->


<aside class="panel">


<h2>📊 Información</h2>



<div class="card">

<h3>Acuario</h3>

<p>
Volumen:
<b id="liters">
84 L
</b>
</p>


<p>
Cristal:
6 mm
</p>


</div>




<div class="card">

<h3>🌊 Agua</h3>

<p>pH 7.0</p>
<p>Temperatura 25ºC</p>
<p>Nitratos 20 mg/L</p>


</div>



<div class="card">

<h3>🐠 Habitantes</h3>

<p>
Sin peces añadidos
</p>


</div>



</aside>



</div>


</div>



<footer>

Acuario Designer Studio © 2026

</footer>



<script src="js/engine.js"></script>
<script src="js/objects.js"></script>
<script src="js/save.js"></script>


</body>

</html>
