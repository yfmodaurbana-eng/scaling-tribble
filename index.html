<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AQUARIO ONLINE - Diseñador 3D</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#030a14;color:white;overflow-x:hidden}
header{display:flex;justify-content:space-between;padding:12px;background:#071223;align-items:center}
.logo{font-size:20px;font-weight:900;line-height:1}.logo span{color:#29a7ff}
header button{background:#1e90ff;color:white;border:0;padding:9px 12px;border-radius:10px;font-weight:bold}
/* BARRA ACCESORIOS ARRIBA DEL ACUARIO */
#toolbar{display:flex;gap:6px;padding:10px 12px;background:#0d1c31;margin:12px 12px 0;border-radius:14px 14px 0 0;overflow-x:auto;white-space:nowrap}
#toolbar button{background:#132a44;border:1px solid #2a4a6b;color:white;padding:10px 12px;border-radius:12px;font-size:14px;cursor:pointer;flex-shrink:0}
#toolbar button:active{background:#1e90ff;transform:scale(.95)}
#toolbar small{display:block;font-size:10px;opacity:.7}
/* ACUARIO 3D REALISTA */
#escena{margin:0 12px 12px;padding:18px 14px 14px;background:linear-gradient(#1a1a1a,#000);border-radius:0 0 18px 18px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#visor{position:relative;height:400px;border-radius:10px;overflow:hidden;background:#062a44;perspective:800px;border:4px solid #111;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2), inset 0 0 60px rgba(0,0,0,.5);touch-action:none}
#visor img.fondo{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.2) contrast(1.05)}
#luz{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.35), transparent 55%), linear-gradient(rgba(0,150,255,.08), rgba(0,20,60,.45));pointer-events:none;z-index:4}
#arena{position:absolute;bottom:0;left:0;right:0;height:52px;background:linear-gradient(#e8d5a8,#c9a86a);z-index:2;clip-path:polygon(0 25%,15% 10%,30% 30%,50% 5%,70% 28%,85% 12%,100% 30%,100% 100%,0 100%)}
#tirante{position:absolute;top:0;left:0;right:0;height:16px;background:#ff4444;display:none;z-index:8;text-align:center;font-size:11px;font-weight:900;line-height:16px}
#cristal{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.05) 18%,transparent 30%,transparent 78%,rgba(255,255,255,.18) 100%);pointer-events:none;z-index:9}
#medidas{position:absolute;bottom:8px;left:10px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:10px;z-index:10;font-size:12px;font-weight:bold}
#ayuda{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 10px;border-radius:20px;font-size:11px;z-index:10;white-space:nowrap}
#papelera{position:absolute;top:22px;right:10px;background:rgba(255,0,0,.85);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:11;opacity:0;transition:.2s}
#papelera.show{opacity:1;transform:scale(1.15)}
/* ITEMS ARRASTRABLES */
.item{position:absolute;z-index:5;cursor:grab;user-select:none;touch-action:none;font-size:38px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));transition:transform .1s}
.item.drag{cursor:grabbing;transform:scale(1.25);z-index:20}
.item.pez{animation:nadar 5s ease-in-out infinite alternate}
@keyframes nadar{0%{transform:translateX(0) rotate(0deg)}100%{transform:translateX(18px) rotate(3deg)}}
.burbuja{position:absolute;background:rgba(255,255,255,.75);border-radius:50%;animation:subir 4s linear infinite;z-index:3;pointer-events:none}
@keyframes subir{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-320px);opacity:0}}
.vista-btns{position:absolute;bottom:8px;right:8px;display:flex;gap:5px;z-index:10}
.vista-btns button{background:rgba(0,0,0,.7);color:white;border:1px solid #555;padding:6px 8px;border-radius:8px;font-size:12px}
main{padding:0 12px 12px}
.panel{background:#0d1c31;padding:14px;border-radius:15px;margin-bottom:12px}
.panel h2{margin:0 0 10px;color:#29a7ff}
.panel label{display:block;margin-top:10px;font-size:14px}
.panel input{width:100%;accent-color:#29a7ff}
.grosores{display:flex;gap:6px;margin-top:6px}
.grosores button{flex:1;background:#132a44;color:white;border:1px solid #2a4a6b;padding:8px;border-radius:8px}
.grosores button.active{background:#1e90ff}
.litros{background:#12365c;margin-top:12px;padding:10px;border-radius:10px;font-size:20px;font-weight:900}
.litros small{display:block;font-size:12px;font-weight:400}
#avisos div{padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px}
.ok{background:#123b24}.warn{background:#4a3800}.bad{background:#5a1111}
</style>
</head>
<body>
<header><div class="logo">🐠 AQUARIO<br><span>ONLINE</span></div><button onclick="window.print()">⬇ Ficha PDF</button></header>

<!-- BOTONES ARRIBA DEL ACUARIO -->
<div id="toolbar">
<button onclick="addItem('pez')">🐟<small>Pez</small></button>
<button onclick="addItem('pez2')">🐠<small>Tropical</small></button>
<button onclick="addItem('planta')">🌿<small>Planta</small></button>
<button onclick="addItem('planta2')">🌱<small>Musgo</small></button>
<button onclick="addItem('roca')">🪨<small>Roca</small></button>
<button onclick="addItem('tronco')">🪵<small>Tronco</small></button>
<button onclick="addItem('casa')">🏠<small>Casa</small></button>
<button onclick="addItem('equipo')">⚙️<small>Filtro</small></button>
<button onclick="addItem('luz')">💡<small>Luz</small></button>
<button onclick="addItem('caracol')">🐌<small>Caracol</small></button>
<button onclick="limpiar()" style="background:#5a1111">🗑️<small>Limpiar</small></button>
</div>

<div id="escena">
<div id="visor">
<img class="fondo" src="https://images.unsplash.com/photo-1544552866-d3ed42536cfd?w=1200&q=80" alt="Acuario plantado">
<div id="arena"></div>
<div id="items"></div>
<div id="luz"></div>
<div id="tirante">⚠ TIRANTE OBLIGATORIO</div>
<div id="cristal"></div>
<div id="ayuda">👆 Arrastra para mover • Saca fuera para borrar</div>
<div id="papelera">🗑️</div>
<div id="medidas">100cm x 40cm x 40cm - 160L</div>
<div class="vista-btns"><button onclick="cambiarVista('montaje')">Montaje</button><button onclick="cambiarVista('real')">Llenar agua</button></div>
<div class="burbuja" style="left:20%;bottom:20px;width:8px;height:8px"></div>
<div class="burbuja" style="left:50%;bottom:10px;width:12px;height:12px;animation-delay:1s"></div>
<div class="burbuja" style="left:75%;bottom:30px;width:6px;height:6px;animation-delay:2s"></div>
</div>
</div>

<main>
<div class="panel"><h2>PARAMETROS</h2>
<label>Largo: <b id="v-largo">100 cm</b></label><input type="range" id="largo" min="30" max="200" value="100">
<label>Ancho: <b id="v-ancho">40 cm</b></label><input type="range" id="ancho" min="25" max="80" value="40">
<label>Alto: <b id="v-alto">40 cm</b></label><input type="range" id="alto" min="25" max="80" value="40">
<label>Grosor cristal:</label><div class="grosores"><button onclick="setGrosor(6,this)">6mm</button><button onclick="setGrosor(8,this)" class="active">8mm</button><button onclick="setGrosor(10,this)">10mm</button><button onclick="setGrosor(12,this)">12mm</button></div>
<div class="litros">💧 <span id="litros">160 L</span><small id="peso"></small></div></div>
<div class="panel"><h2>DIAGNOSTICO</h2><div id="avisos"></div><h3>Ficha de cortes:</h3><ul id="ficha"></ul></div>
</main>
<script>
let largo=100,ancho=40,alto=40,grosor=8,conAgua=true;
let visor=document.getElementById('visor'),itemsEl=document.getElementById('items'),papelera=document.getElementById('papelera');
let MAP={pez:'🐟',pez2:'🐠',planta:'🌿',planta2:'🌱',roca:'🪨',tronco:'🪵',casa:'🏠',equipo:'⚙️',luz:'💡',caracol:'🐌'};
let SIZES={pez:42,pez2:42,planta:56,planta2:44,roca:52,tronco:68,casa:62,equipo:48,luz:38,caracol:36};
function addItem(tipo){
  let el=document.createElement('div');el.className='item'+(tipo.includes('pez')?' pez':'');el.textContent=MAP[tipo];
  el.style.fontSize=SIZES[tipo]+'px';
  // planta y roca van al suelo, peces en medio
  let top = (tipo.includes('planta')||tipo==='roca'||tipo==='tronco'||tipo==='casa') ? 68+Math.random()*15 : 30+Math.random()*35;
  el.style.left=(15+Math.random()*60)+'%';el.style.top=top+'%';
  itemsEl.appendChild(el);makeDraggable(el);actualizar();
}
function makeDraggable(el){
  let startX,startY,origX,origY,dragging=false;
  el.addEventListener('pointerdown',e=>{
    dragging=true;el.classList.add('drag');el.setPointerCapture(e.pointerId);
    startX=e.clientX;startY=e.clientY;
    origX=el.offsetLeft;origY=el.offsetTop;papelera.classList.add('show');
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging)return;
    let dx=e.clientX-startX,dy=e.clientY-startY;
    el.style.left=(origX+dx)+'px';el.style.top=(origY+dy)+'px';
    // si está cerca del borde, vibra la papelera
    let r=visor.getBoundingClientRect();
    if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right){papelera.style.background='#ff0000';papelera.style.transform='scale(1.4)';}
    else{papelera.style.background='rgba(255,0,0,.85)';papelera.style.transform='scale(1.15)';}
  });
  el.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;el.classList.remove('drag');papelera.classList.remove('show');
    let r=visor.getBoundingClientRect();
    // SI LO SUELTAS FUERA DEL ACUARIO -> SE BORRA
    if(e.clientX<r.left-20||e.clientX>r.right+20||e.clientY<r.top-20||e.clientY>r.bottom+20){
      el.remove(); if(navigator.vibrate) navigator.vibrate(60);
    } else {
      // mantener dentro
      el.style.left=Math.max(0,Math.min(visor.clientWidth-40,el.offsetLeft))+'px';
      el.style.top=Math.max(0,Math.min(visor.clientHeight-50,el.offsetTop))+'px';
    }
    actualizar();
  });
}
function limpiar(){itemsEl.innerHTML='';actualizar();}
function cambiarVista(v){
  conAgua=(v==='real');
  document.querySelector('#visor img.fondo').style.filter=conAgua?'saturate(1.2)':'brightness(.65) sepia(.3)';
}
function setGrosor(g,btn){grosor=g;document.querySelectorAll('.grosores button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');actualizar();}
function actualizar(){
  document.getElementById('v-largo').textContent=largo+' cm';document.getElementById('v-ancho').textContent=ancho+' cm';document.getElementById('v-alto').textContent=alto+' cm';
  let litros=Math.round(largo*ancho*alto/1000);document.getElementById('litros').textContent=litros+' L';
  document.getElementById('peso').textContent='Peso total ~'+Math.round(litros*1.15+15)+' kg - Cristal '+grosor+'mm';
  document.getElementById('medidas').textContent=`${largo}cm x ${ancho}cm x ${alto}cm - ${litros}L`;
  document.getElementById('tirante').style.display=(largo>90||alto>45)?'block':'none';
  // el acuario cambia de altura según el slider
  document.getElementById('visor').style.height=(300+(alto-25)/55*140)+'px';
  let rec=alto<=30?6:alto<=40?8:alto<=50?10:12;let a='';
  if(grosor>=rec)a+=`<div class="ok">✅ CORRECTO: ${grosor}mm es seguro para ${alto}cm.</div>`;
  else a+=`<div class="bad">🚨 PELIGRO: Con ${alto}cm necesitas ${rec}mm mínimo.</div>`;
  if(largo>90)a+=`<div class="warn">⚠️ TIRANTE OBLIGATORIO: Largo ${largo}cm > 90cm.</div>`;
  if(largo>130)a+=`<div class="warn">⚠️ PON 2 TIRANTES.</div>`;
  document.getElementById('avisos').innerHTML=a||`<div class="ok">✅ Montaje seguro</div>`;
  document.getElementById('ficha').innerHTML=`<li>Frontal/Trasero: 2x ${largo} x ${alto} cm</li><li>Laterales: 2x ${(ancho-grosor*2/10).toFixed(1)} x ${alto} cm</li><li>Base: 1x ${largo} x ${ancho} cm</li><li>Silicona: ${litros<=100?1:litros<=250?2:3} tubo(s)</li><li>Tirantes: ${largo>90?'1x '+(ancho-2)+' x 8cm':'No necesita'}</li>`;
}
document.getElementById('largo').addEventListener('input',e=>{largo=+e.target.value;actualizar();});
document.getElementById('ancho').addEventListener('input',e=>{ancho=+e.target.value;actualizar();});
document.getElementById('alto').addEventListener('input',e=>{alto=+e.target.value;actualizar();});
// decor inicial
['pez','pez2','planta','planta','roca','tronco'].forEach(addItem);
actualizar();
</script>
</body>
</html>
