<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acuario Designer Studio PRO</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


<header class="header">


<div class="logo">

🐠 Acuario Designer

<span>PRO</span>

</div>


<div class="actions">

<button>Nuevo</button>

<button>Guardar</button>

<button>Exportar</button>

</div>


</header>




<main class="main">



<!-- PANEL IZQUIERDO -->


<aside class="sidebar">


<h2>🛠 Herramientas</h2>


<div class="tool-grid">


<button class="tool">
🪨<br>
Roca
</button>


<button class="tool">
🌱<br>
Planta
</button>


<button class="tool">
🐟<br>
Pez
</button>


<button class="tool">
💡<br>
Luz
</button>


</div>





<section class="config">


<h2>📐 Diseño</h2>



<label>

Largo

<input id="largo" value="70">

cm

</label>



<label>

Ancho

<input id="ancho" value="30">

cm

</label>



<label>

Alto

<input id="alto" value="40">

cm

</label>





<div class="card">


<h3>🪟 Cristal</h3>


<div id="cristal">

Calculando...

</div>


<div id="resultadoCristal">

Esperando datos

</div>


</div>






<button id="crearAcuario" class="create">

🏗 Crear acuario

</button>



</section>


</aside>







<!-- VISOR -->


<section class="viewer">


<div class="aquarium">


<div class="water"></div>

<div class="sand"></div>


</div>



</section>







<!-- PANEL DERECHO -->


<aside class="panel">


<h2>📊 Información</h2>




<div class="card">


<h3>🐠 Acuario</h3>


<p>

Volumen:

<b id="litros">

0 L

</b>

</p>



<p>

Medidas:

<b id="medidas">

-

</b>

</p>


</div>







<div class="card">


<h3>🛡 Seguridad</h3>


<div id="seguridad">

Esperando datos

</div>


</div>






<div class="card">


<h3>📋 Ficha técnica</h3>


<div id="fichaTecnica">

Pulsa crear

</div>


</div>






</aside>




</main>




<footer>

Acuario Designer Studio © 2026

</footer>




</div>





<script src="js/engine.js"></script>

<script src="js/ficha.js"></script>

<script src="js/objects.js"></script>

<script src="js/save.js"></script>


</body>


</html>
