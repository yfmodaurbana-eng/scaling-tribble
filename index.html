<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AQUARIO ONLINE - Urna 3D Realista</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#030a14;color:white;overflow-x:hidden}
header{display:flex;justify-content:space-between;padding:12px;background:#071223;align-items:center}
.logo{font-size:20px;font-weight:900;line-height:1}.logo span{color:#29a7ff}
header button{background:#1e90ff;color:white;border:0;padding:9px 12px;border-radius:10px;font-weight:bold}
#menu{display:flex;gap:6px;padding:10px 12px;background:#0d1c31;margin:12px 12px 0;border-radius:14px 14px 0 0;overflow-x:auto}
#menu button{background:#132a44;border:1px solid #2a4a6b;color:white;padding:10px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;font-size:14px}
#menu button.active{background:#1e90ff}
#panel{margin:0 12px;background:#132a44;padding:12px;border-radius:0 0 14px 14px;display:none}
#panel.show{display:block}
#panel h3{margin:0 0 8px;font-size:14px;color:#29a7ff}
.opciones{display:flex;gap:8px;flex-wrap:wrap}
.opciones button{background:#0d1c31;border:1px solid #2a4a6b;color:white;padding:10px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.opciones button:active{background:#1e90ff}
.opciones small{display:block;font-size:10px;opacity:.7}
input[type=range]{width:100%;accent-color:#29a7ff}
/* MODO GIRAR / MOVER */
#modos{display:flex;gap:8px;margin:12px 12px 0}
#modos button{flex:1;padding:12px;border-radius:12px;border:1px solid #2a4a6b;background:#132a44;color:white;font-weight:bold;font-size:14px;cursor:pointer}
#modos button.active{background:#1e90ff;border-color:#1e90ff}
#escena{margin:12px;padding:10px;background:#111;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#visor{position:relative;height:440px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2a6a9a 0%,#0a3a5e 55%,#030a14 100%);touch-action:none;cursor:grab}
#visor.mover{cursor:crosshair}
#visor canvas{width:100%!important;height:100%!important;display:block}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:11px;z-index:5;white-space:nowrap}
#medidas{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:bold;z-index:5;white-space:nowrap}
#tirante{position:absolute;top:38px;left:10px;right:10px;background:#ff4444;text-align:center;font-size:11px;font-weight:900;padding:4px;border-radius:8px;display:none;z-index:5}
#contador{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:5px 8px;border-radius:10px;font-size:11px;z-index:5}
#seleccionado{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#1e90ff;padding:8px 10px;border-radius:12px;font-size:12px;font-weight:bold;display:none;z-index:6;white-space:nowrap}
#seleccionado button{background:#fff;color:#111;border:0;padding:5px 8px;border-radius:8px;margin-left:6px;font-weight:bold}
#controles-mover{display:none;gap:6px;margin:0 12px 12px}
#controles-mover.show{display:flex}
#controles-mover button{flex:1;background:#132a44;color:white;border:1px solid #2a4a6b;padding:10px;border-radius:10px}
main{padding:0 12px 12px}
.panel{background:#0d1c31;padding:14px;border-radius:15px;margin-bottom:12px}
.panel h2{margin:0 0 10px;color:#29a7ff}
.panel label{display:block;margin-top:10px;font-size:14px}
.panel input{width:100%}
.grosores{display:flex;gap:6px;margin-top:6px}
.grosores button{flex:1;background:#132a44;color:white;border:1px solid #2a4a6b;padding:8px;border-radius:8px}
.grosores button.active{background:#1e90ff}
.litros{background:#12365c;margin-top:12px;padding:10px;border-radius:10px;font-size:20px;font-weight:900}
.litros small{display:block;font-size:12px;font-weight:400}
#avisos div{padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px}
.ok{background:#123b24}.warn{background:#4a3800}.bad{background:#5a1111}
#lista{font-size:12px;opacity:.9}
</style>
</head>
<body>
<header><div class="logo">🐠 AQUARIO<br><span>ONLINE</span></div><button onclick="window.print()">⬇ Ficha PDF</button></header>

<div id="menu">
<button onclick="abrir('agua',this)" class="active">💧 Agua</button>
<button onclick="abrir('arena',this)">🏖️ Arena / Sustrato</button>
<button onclick="abrir('rocas',this)">🪨 Rocas</button>
<button onclick="abrir('plantas',this)">🌿 Plantas</button>
<button onclick="abrir('peces',this)">🐟 Peces</button>
<button onclick="abrir('equipo',this)">⚙️ Equipo</button>
<button onclick="limpiarTodo()" style="background:#5a1111">🗑️ Vaciar</button>
</div>
<div id="panel" class="show"></div>

<div id="modos">
<button id="btn-girar" class="active" onclick="setModo('girar')">🔄 GIRAR URNA</button>
<button id="btn-mover" onclick="setModo('mover')">✋ MOVER COSAS</button>
</div>

<div id="escena">
<div id="visor"><div id="hint">🔄 Arrastra para girar</div><div id="tirante">⚠ TIRANTE OBLIGATORIO</div><div id="contador">0 objetos</div><div id="seleccionado"></div><div id="medidas">100 x 40 x 40 cm - 160L</div></div>
</div>
<div id="controles-mover">
<button onclick="moverSeleccionado('izq')">⬅️</button>
<button onclick="moverSeleccionado('der')">➡️</button>
<button onclick="moverSeleccionado('arriba')">⬆️ Subir</button>
<button onclick="moverSeleccionado('abajo')">⬇️ Bajar</button>
<button onclick="borrarSeleccionado()" style="background:#a00">🗑️ Borrar</button>
</div>

<main>
<div class="panel"><h2>PARAMETROS URNA</h2>
<label>Largo: <b id="v-largo">100 cm</b></label><input type="range" id="largo" min="30" max="200" value="100">
<label>Ancho: <b id="v-ancho">40 cm</b></label><input type="range" id="ancho" min="25" max="80" value="40">
<label>Alto: <b id="v-alto">40 cm</b></label><input type="range" id="alto" min="25" max="80" value="40">
<label>Grosor:</label><div class="grosores"><button onclick="setGrosor(6,this)">6mm</button><button onclick="setGrosor(8,this)" class="active">8mm</button><button onclick="setGrosor(10,this)">10mm</button><button onclick="setGrosor(12,this)">12mm</button></div>
<div class="litros">💧 <span id="litros">160 L</span><small id="peso"></small></div>
<div id="lista"></div></div>
<div class="panel"><h2>DIAGNOSTICO</h2><div id="avisos"></div><h3>Ficha de cortes:</h3><ul id="ficha"></ul></div>
</main>

<script>
let largo=100,ancho=40,alto=40,grosor=8,nivelAgua=85,arenaTipo='Arena Clara',sustratoTipo='Sin sustrato';
let scene,camera,renderer,urna,grupoAgua,grupoArena,grupoSustrato,grupoRocas,grupoPlantas,grupoPeces,grupoEquipo,grupoBurbujas;
let rotY=0.6,rotX=0.12,targetRotY=0.6,targetRotX=0.12,zoom=210;
let dragging=false,lastX,lastY,modo='girar',seleccionado=null,arrastrandoObjeto=false;
let objetos=[];let panel=document.getElementById('panel');
let raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();

const PANELES={
agua:`<h3>💧 NIVEL DE AGUA</h3><label>Nivel: <b id="v-agua">${nivelAgua}%</b></label><input type="range" min="0" max="100" value="${nivelAgua}" oninput="setAgua(this.value)"><div class="opciones" style="margin-top:10px"><button onclick="setAgua(0)">Vacía</button><button onclick="setAgua(50)">Mitad 50%</button><button onclick="setAgua(85)">Llena 85%</button><button onclick="setAgua(98)">Al borde 98%</button></div>`,
arena:`<h3>🏖️ ARENA / SUSTRATO</h3><p style="font-size:12px">Arena:</p><div class="opciones"><button onclick="setArena('Arena Clara','0xe8d096')">🏖️ Clara</button><button onclick="setArena('Arena Negra','0x1a1a1a')">⬛ Negra</button><button onclick="setArena('Arena Blanca','0xffffff')">⬜ Blanca</button><button onclick="setArena('Grava','0x8b6a3a')">🟤 Grava</button><button onclick="setArena('Sin arena','0x000000')">🚫 Sin arena</button></div><p style="font-size:12px;margin-top:10px">Sustrato:</p><div class="opciones"><button onclick="setSustrato('Sin sustrato')">🚫 Sin sustrato</button><button onclick="setSustrato('Nutritivo')">🌱 Nutritivo</button><button onclick="setSustrato('Volcánica')">🌋 Volcánica</button></div><label style="margin-top:10px">Grosor arena: <b id="v-arena">4 cm</b></label><input type="range" min="0" max="12" value="4" oninput="setGrosorArena(this.value)">`,
rocas:`<h3>🪨 ROCAS</h3><div class="opciones"><button onclick="addRoca('Dragon','0x777777')">🐉 Dragon</button><button onclick="addRoca('Seiryu','0x8a8a8a')">⛰️ Seiryu</button><button onclick="addRoca('Lava Negra','0x1a1a1a')">🌋 Lava Negra</button><button onclick="addRoca('Lava Roja','0x8b2a1a')">🔴 Lava Roja</button><button onclick="addRoca('Roca Blanca','0xdddddd')">⚪ Blanca</button><button onclick="addRoca('Madera Fósil','0x6b4a2a')">🪵 Madera Fósil</button><button onclick="addRoca('Cuarzo','0xeeeeee')">💎 Cuarzo</button><button onclick="addRoca('Pizarra','0x333333')">⬛ Pizarra</button></div>`,
plantas:`<h3>🌿 PLANTAS TÍPICAS</h3><div class="opciones"><button onclick="addPlanta('Anubia','0x1a7a2a')">🌿 Anubia</button><button onclick="addPlanta('Vallisneria','0x2ecc71')">🌱 Vallisneria</button><button onclick="addPlanta('Echinodorus','0x27ae60')">🍃 Echinodorus</button><button onclick="addPlanta('Musgo Java','0x2a9a4a')">🟢 Musgo Java</button><button onclick="addPlanta('Cryptocoryne','0x1e6a2a')">🌿 Crypto</button><button onclick="addPlanta('Hygrophila','0x3ac76a')">🌿 Hygrophila</button><button onclick="addPlanta('Cabomba','0x4ae08a')">🌿 Cabomba</button><button onclick="addPlanta('Helecho Java','0x1a5a2a')">🌿 Helecho</button></div>`,
peces:`<h3>🐟 PECES</h3><div class="opciones"><button onclick="addPez('Guppy','0xff7b00')">🐟 Guppy</button><button onclick="addPez('Neón Tetra','0x00ccff')">🐟 Neón</button><button onclick="addPez('Betta','0xff2222')">🐠 Betta</button><button onclick="addPez('Goldfish','0xffa500')">🐡 Goldfish</button><button onclick="addPez('Escalar','0xdddddd')">🐟 Escalar</button><button onclick="addPez('Corydora','0xaaaaaa')">🐟 Corydora</button><button onclick="addPez('Molly','0x222222')">🐟 Molly</button><button onclick="addPez('Platy','0xff5555')">🐟 Platy</button><button onclick="addPez('Cardenal','0x00ffff')">🐟 Cardenal</button><button onclick="addPez('Disco','0xff9999')">🐟 Disco</button></div>`,
equipo:`<h3>⚙️ EQUIPO</h3><div class="opciones"><button onclick="addEquipo('Filtro')">🔲 Filtro</button><button onclick="addEquipo('Calentador')">🌡️ Calentador</button><button onclick="addEquipo('Luz LED')">💡 Luz LED</button><button onclick="addEquipo('Tronco')">🪵 Tronco</button><button onclick="addEquipo('Casa')">🏠 Casa / Cueva</button></div>`
};
function abrir(tipo,btn){document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');panel.innerHTML=PANELES[tipo];panel.classList.add('show');}
function setModo(m){
  modo=m;seleccionado=null;document.getElementById('seleccionado').style.display='none';
  document.getElementById('btn-girar').classList.toggle('active',m==='girar');
  document.getElementById('btn-mover').classList.toggle('active',m==='mover');
  document.getElementById('visor').classList.toggle('mover',m==='mover');
  document.getElementById('controles-mover').classList.toggle('show',m==='mover');
  document.getElementById('hint').textContent=m==='girar'?'🔄 Arrastra para girar':'✋ Toca un objeto y arrástralo para moverlo';
}
function centrarUrna(){urna.position.y=-alto/2;urna.position.x=0;urna.position.z=0;let mayor=Math.max(largo,ancho,alto);zoom=mayor*2.05;camera.position.set(0,0,zoom);camera.lookAt(0,0,0);}
// TEXTURA ARENA REALISTA - canvas con granos
function texturaArena(colorHex){
  let c=document.createElement('canvas');c.width=256;c.height=256;let ctx=c.getContext('2d');
  ctx.fillStyle='#'+new THREE.Color(colorHex).getHexString();ctx.fillRect(0,0,256,256);
  for(let i=0;i<3500;i++){let x=Math.random()*256,y=Math.random()*256,s=Math.random()*2.5+0.5;ctx.fillStyle=Math.random()>0.5?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.25)';ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(0,0,0,0.08)';ctx.beginPath();ctx.ellipse(Math.random()*256,Math.random()*256,20+Math.random()*30,6+Math.random()*8,Math.random(),0,Math.PI*2);ctx.fill();}
  let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,1);return t;
}
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,1,0.1,2000);camera.position.set(0,0,zoom);camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(1.5);
  let visor=document.getElementById('visor');visor.appendChild(renderer.domElement);
  function resize(){let w=visor.clientWidth,h=visor.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize);resize();
  scene.add(new THREE.AmbientLight(0xffffff,1));
  let dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(80,200,100);scene.add(dir);
  let dir2=new THREE.DirectionalLight(0x66ccff,0.6);dir2.position.set(-100,50,-100);scene.add(dir2);
  urna=new THREE.Group();scene.add(urna);
  grupoAgua=new THREE.Group();grupoArena=new THREE.Group();grupoSustrato=new THREE.Group();grupoRocas=new THREE.Group();grupoPlantas=new THREE.Group();grupoPeces=new THREE.Group();grupoEquipo=new THREE.Group();grupoBurbujas=new THREE.Group();
  urna.add(grupoAgua,grupoArena,grupoSustrato,grupoRocas,grupoPlantas,grupoPeces,grupoEquipo,grupoBurbujas);
  dibujarUrna();dibujarArena();dibujarAgua();crearBurbujas();
  // EVENTOS: GIRAR O MOVER
  visor.addEventListener('pointerdown',e=>{
    lastX=e.clientX;lastY=e.clientY;
    if(modo==='mover'){
      let hit=raycastObjeto(e);
      if(hit){seleccionar(hit);arrastrandoObjeto=true;visor.setPointerCapture(e.pointerId);}
      else{deseleccionar();}
    } else {dragging=true;visor.setPointerCapture(e.pointerId);}
  });
  visor.addEventListener('pointermove',e=>{
    if(modo==='mover' && arrastrandoObjeto && seleccionado){
      // mover en plano XZ según arrastre
      seleccionado.position.x += (e.clientX-lastX)*0.35;
      seleccionado.position.z += (e.clientY-lastY)*0.35;
      seleccionado.position.x=Math.max(-largo/2+8,Math.min(largo/2-8,seleccionado.position.x));
      seleccionado.position.z=Math.max(-ancho/2+6,Math.min(ancho/2-6,seleccionado.position.z));
      lastX=e.clientX;lastY=e.clientY;
    } else if(dragging){
      targetRotY+=(e.clientX-lastX)*0.008;targetRotX+=(e.clientY-lastY)*0.005;targetRotX=Math.max(-0.6,Math.min(0.6,targetRotX));lastX=e.clientX;lastY=e.clientY;
    }
  });
  visor.addEventListener('pointerup',()=>{dragging=false;arrastrandoObjeto=false;});
  visor.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(120,Math.min(420,zoom+e.deltaY*0.4));camera.position.z=zoom;},{passive:false});
  animar();
}
function raycastObjeto(e){
  let visor=document.getElementById('visor');let r=visor.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  let todos=[...grupoRocas.children,...grupoPlantas.children,...grupoPeces.children,...grupoEquipo.children];
  let hits=raycaster.intersectObjects(todos,true);
  if(!hits.length) return null;
  let o=hits[0].object;while(o.parent && !todos.includes(o)) o=o.parent;return o;
}
function seleccionar(obj){
  if(seleccionado) seleccionado.traverse(c=>{if(c.material && c.material.emissive) c.material.emissive.setHex(0x000000);});
  seleccionado=obj;
  obj.traverse(c=>{if(c.material && c.material.emissive) c.material.emissive.setHex(0x1e90ff);});
  let box=document.getElementById('seleccionado');box.style.display='block';box.innerHTML=`✋ ${obj.userData.tipo||'Objeto'} <button onclick="borrarSeleccionado()">🗑️ Borrar</button> <button onclick="duplicarSeleccionado()">⧉ Duplicar</button>`;
  if(navigator.vibrate) navigator.vibrate(20);
}
function deseleccionar(){if(seleccionado) seleccionado.traverse(c=>{if(c.material && c.material.emissive) c.material.emissive.setHex(0x000000);});seleccionado=null;document.getElementById('seleccionado').style.display='none';}
function borrarSeleccionado(){if(!seleccionado)return;let p=seleccionado.parent;if(p)p.remove(seleccionado);objetos=objetos.filter(o=>o!==seleccionado);desel();actualizar();}
function desel(){desleccionar();}
function desleccionar(){desleccionar2();}
function desleccionar2(){if(seleccionado) seleccionado.traverse(c=>{if(c.material&&c.material.emissive)c.material.emissive.setHex(0x000000);});seleccionado=null;document.getElementById('seleccionado').style.display='none';}
function duplicarSeleccionado(){if(!seleccionado)return;let c=seleccionado.clone();c.position.x+=12;c.userData={...seleccionado.userData};seleccionado.parent.add(c);objetos.push(c);seleccionar(c);actualizar();}
function moverSeleccionado(dir){if(!seleccionado)return;if(dir==='izq')seleccionado.position.x-=6;if(dir==='der')seleccionado.position.x+=6;if(dir==='arriba')seleccionado.position.y+=5;if(dir==='abajo')seleccionado.position.y=Math.max(grosorArena,seleccionado.position.y-5);}
function dibujarUrna(){
  urna.children.filter(c=>c.userData.esCristal).forEach(c=>urna.remove(c));
  let mat=new THREE.MeshPhysicalMaterial({color:0xbfe8ff,transparent:true,opacity:0.13,roughness:0.05,metalness:0,side:THREE.DoubleSide});
  let frontal=new THREE.Mesh(new THREE.BoxGeometry(largo,alto,0.5),mat);frontal.position.set(0,alto/2,ancho/2);frontal.userData.esCristal=true;urna.add(frontal);
  let trasero=frontal.clone();trasero.position.z=-ancho/2;urna.add(trasero);
  let lat=new THREE.Mesh(new THREE.BoxGeometry(0.5,alto,ancho),mat);lat.position.set(-largo/2,alto/2,0);lat.userData.esCristal=true;urna.add(lat);
  let lat2=lat.clone();lat2.position.x=largo/2;urna.add(lat2);
  let base=new THREE.Mesh(new THREE.BoxGeometry(largo+5,5,ancho+5),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.5}));base.position.y=-2.5;base.userData.esCristal=true;urna.add(base);
  let marco=new THREE.Mesh(new THREE.BoxGeometry(largo+5,3.5,ancho+5),new THREE.MeshStandardMaterial({color:0x111111,roughness:0.3}));marco.position.y=alto+1.5;marco.userData.esCristal=true;urna.add(marco);
  // silicona esquinas
  for(let sx of [-1,1]){for(let sz of [-1,1]){let sil=new THREE.Mesh(new THREE.BoxGeometry(1,alto,1),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.35}));sil.position.set(sx*largo/2,alto/2,sz*ancho/2);sil.userData.esCristal=true;urna.add(sil);}}
  if(largo>90||alto>45){let t=new THREE.Mesh(new THREE.BoxGeometry(8,2,ancho),new THREE.MeshStandardMaterial({color:0xff2222}));t.position.set(0,alto,0);t.userData.esCristal=true;urna.add(t);document.getElementById('tirante').style.display='block';} else document.getElementById('tirante').style.display='none';
  centrarUrna();
}
let grosorArena=4, colorArena=0xe8d096;
function dibujarArena(){
  grupoArena.clear();grupoSustrato.clear();
  if(colorArena!==0x000000){
    let tex=texturaArena(colorArena);
    let geo=new THREE.BoxGeometry(largo-1,grosorArena,ancho-1);
    // ondular la parte superior
    let pos=geo.attributes.position;for(let i=0;i<pos.count;i++){if(pos.getY(i)>0) pos.setY(i,pos.getY(i)+Math.sin(pos.getX(i)*0.15)*0.6+Math.cos(pos.getZ(i)*0.2)*0.5);}
    geo.computeVertexNormals();
    let a=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:1}));a.position.y=grosorArena/2;grupoArena.add(a);
    // piedritas sueltas
    for(let i=0;i<70;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(0.6+Math.random()*0.7,5,5),new THREE.MeshStandardMaterial({color:Math.random()>0.5?0xffffff:0x8a6a3a}));p.position.set((Math.random()-0.5)*(largo-4),grosorArena+0.4,(Math.random()-0.5)*(ancho-4));grupoArena.add(p);}
  }
  if(sustratoTipo!=='Sin sustrato'){let s=new THREE.Mesh(new THREE.BoxGeometry(largo-1,2,ancho-1),new THREE.MeshStandardMaterial({color:0x3a1e08,roughness:1}));s.position.y=1;grupoSustrato.add(s);}
}
function dibujarAgua(){
  grupoAgua.clear();
  if(nivelAgua<=0)return;
  let h=alto*nivelAgua/100;
  let agua=new THREE.Mesh(new THREE.BoxGeometry(largo-1.5,h,ancho-1.5),new THREE.MeshPhysicalMaterial({color:0x2aa8e8,transparent:true,opacity:0.22,roughness:0.05,transmission:0.2}));
  agua.position.y=h/2+grosorArena;grupoAgua.add(agua);
  let sup=new THREE.Mesh(new THREE.PlaneGeometry(largo-1.5,ancho-1.5),new THREE.MeshStandardMaterial({color:0xaee6ff,transparent:true,opacity:0.5,roughness:0.1,metalness:0.3}));sup.rotation.x=-Math.PI/2;sup.position.y=h+grosorArena+0.1;grupoAgua.add(sup);
  // rayos de luz
  for(let i=0;i<3;i++){let ray=new THREE.Mesh(new THREE.PlaneGeometry(12,h),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.07,side:THREE.DoubleSide,depthWrite:false}));ray.position.set(-largo/3+i*largo/3,h/2+grosorArena,0);ray.rotation.z=0.4;grupoAgua.add(ray);}
}
function crearBurbujas(){
  grupoBurbujas.clear();
  for(let i=0;i<18;i++){let b=new THREE.Mesh(new THREE.SphereGeometry(0.6+Math.random()*1,6,6),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.6}));b.position.set((Math.random()-0.5)*largo,grosorArena+Math.random()*alto,(Math.random()-0.5)*ancho);b.userData={vel:0.4+Math.random()*0.6};grupoBurbujas.add(b);}
}
function setAgua(v){nivelAgua=+v;document.getElementById('v-agua').textContent=nivelAgua+'%';dibujarAgua();actualizar();}
function setArena(nombre,color){arenaTipo=nombre;colorArena=color;dibujarArena();actualizar();}
function setSustrato(n){sustratoTipo=n;dibujarArena();actualizar();}
function setGrosorArena(v){grosorArena=+v;document.getElementById('v-arena').textContent=v+' cm';dibujarArena();dibujarAgua();}
function addRoca(nombre,color){
  let geo=new THREE.DodecahedronGeometry(9+Math.random()*5,1);
  let pos=geo.attributes.position;for(let i=0;i<pos.count;i++){let s=1+(Math.random()-0.5)*0.5;pos.setXYZ(i,pos.getX(i)*s,pos.getY(i)*0.7,pos.getZ(i)*s);}geo.computeVertexNormals();
  let m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,flatShading:true,roughness:0.95}));
  m.position.set((Math.random()-0.5)*(largo-30),grosorArena+4,(Math.random()-0.5)*(ancho-20));m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  m.userData={tipo:'Roca '+nombre};grupoRocas.add(m);objetos.push(m);seleccionar(m);actualizar();
}
function addPlanta(nombre,color){
  let g=new THREE.Group();
  let tallo=new THREE.Mesh(new THREE.CylinderGeometry(0.7,1,30,6),new THREE.MeshStandardMaterial({color:0x1a5a1a}));tallo.position.y=15;g.add(tallo);
  for(let i=0;i<9;i++){
    let hoja=new THREE.Mesh(new THREE.ConeGeometry(2.8,16,5),new THREE.MeshStandardMaterial({color,roughness:0.6}));
    hoja.position.set((Math.random()-0.5)*10,18+Math.random()*14,(Math.random()-0.5)*10);hoja.rotation.set((Math.random()-0.5)*0.9,Math.random()*3,(Math.random()-0.5)*0.9);g.add(hoja);
    let hoja2=new THREE.Mesh(new THREE.PlaneGeometry(5,10),new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide}));hoja2.position.set((Math.random()-0.5)*8,20+Math.random()*8,(Math.random()-0.5)*8);hoja2.rotation.y=Math.random()*3;g.add(hoja2);
  }
  if(nombre.includes('Musgo'))g.scale.set(1.5,0.35,1.5);
  if(nombre.includes('Vallisneria'))g.scale.set(0.7,1.7,0.7);
  g.position.set((Math.random()-0.5)*(largo-20),grosorArena,(Math.random()-0.5)*(ancho-14));
  g.userData={tipo:'Planta '+nombre};grupoPlantas.add(g);objetos.push(g);seleccionar(g);actualizar();
}
function addPez(nombre,color){
  let g=new THREE.Group();
  let cuerpo=new THREE.Mesh(new THREE.SphereGeometry(4,12,10),new THREE.MeshStandardMaterial({color,roughness:0.4,metalness:0.2}));cuerpo.scale.set(1.8,1,0.7);g.add(cuerpo);
  let cola=new THREE.Mesh(new THREE.ConeGeometry(3,6,6),new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide}));cola.rotation.z=Math.PI/2;cola.position.x=-8;cola.scale.set(1,1,0.3);g.add(cola);cola.userData.esCola=true;g.userData.cola=cola;
  let aleta=new THREE.Mesh(new THREE.ConeGeometry(2,4,4),new THREE.MeshStandardMaterial({color}));aleta.position.set(0,3.5,0);aleta.rotation.x=Math.PI;g.add(aleta);
  let ojo=new THREE.Mesh(new THREE.SphereGeometry(0.9,8,8),new THREE.MeshStandardMaterial({color:0x000000}));ojo.position.set(5,1,2.2);g.add(ojo);
  let ojo2=ojo.clone();ojo2.position.z=-2.2;g.add(ojo2);
  let brillo=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));brillo.position.set(5.5,1.5,2.2);g.add(brillo);
  if(nombre==='Goldfish'||nombre==='Disco')g.scale.set(1.5,1.5,1.5);
  g.position.set((Math.random()-0.5)*(largo-20),grosorArena+12+Math.random()*alto*0.4,(Math.random()-0.5)*(ancho-16));
  g.userData={tipo:'Pez '+nombre,vel:0.35+Math.random()*0.35,dir:1,cola};
  grupoPeces.add(g);objetos.push(g);seleccionar(g);actualizar();
}
function addEquipo(tipo){
  let m;
  if(tipo==='Filtro')m=new THREE.Mesh(new THREE.BoxGeometry(10,15,6),new THREE.MeshStandardMaterial({color:0x111111,roughness:0.4}));
  else if(tipo==='Calentador')m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,22,8),new THREE.MeshStandardMaterial({color:0xdddddd}));
  else if(tipo==='Luz LED')m=new THREE.Mesh(new THREE.BoxGeometry(largo-10,2.5,6),new THREE.MeshStandardMaterial({color:0xffffaa,emissive:0xffffaa,emissiveIntensity:0.9}));
  else if(tipo==='Tronco'){m=new THREE.Group();for(let i=0;i<3;i++){let c=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,26,6),new THREE.MeshStandardMaterial({color:0x7a4a22}));c.rotation.z=0.6+i*0.4;c.position.set(i*5,0,i*3);m.add(c);} }
  else m=new THREE.Mesh(new THREE.BoxGeometry(11,9,11),new THREE.MeshStandardMaterial({color:0x8b5a2b}));
  if(tipo==='Luz LED')m.position.set(0,alto+4,0);else m.position.set(largo/2-12,grosorArena+8,0);
  m.userData={tipo};grupoEquipo.add(m);objetos.push(m);seleccionar(m);actualizar();
}
function limpiarTodo(){grupoRocas.clear();grupoPlantas.clear();grupoPeces.clear();grupoEquipo.clear();objetos=[];desleccionar2();actualizar();}
function animar(){
  requestAnimationFrame(animar);
  rotY+=(targetRotY-rotY)*0.08;rotX+=(targetRotX-rotX)*0.08;urna.rotation.y=rotY;urna.rotation.x=rotX;
  grupoPeces.children.forEach(p=>{if(p!==seleccionado){p.position.x+=p.userData.vel*p.userData.dir;if(Math.abs(p.position.x)>largo/2-12){p.userData.dir*=-1;p.rotation.y+=Math.PI;}}p.position.y+=Math.sin(Date.now()*0.001+p.position.x)*0.04;if(p.userData.cola)p.userData.cola.rotation.y=Math.sin(Date.now()*0.01)*0.4;});
  grupoPlantas.children.forEach((pl,i)=>{pl.rotation.z=Math.sin(Date.now()*0.001+i)*0.04;});
  grupoBurbujas.children.forEach(b=>{b.position.y+=b.userData.vel;if(b.position.y>grosorArena+alto)b.position.y=grosorArena+2;});
  renderer.render(scene,camera);
}
function setGrosor(g,btn){grosor=g;document.querySelectorAll('.grosores button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');actualizar();}
function actualizar(){
  document.getElementById('v-largo').textContent=largo+' cm';document.getElementById('v-ancho').textContent=ancho+' cm';document.getElementById('v-alto').textContent=alto+' cm';
  let litros=Math.round(largo*ancho*alto/1000);document.getElementById('litros').textContent=litros+' L';
  document.getElementById('peso').textContent='Peso total ~'+Math.round(litros*1.15+15)+' kg - Cristal '+grosor+'mm | Agua '+nivelAgua+'% | Arena '+arenaTipo+' | Sustrato '+sustratoTipo;
  document.getElementById('medidas').textContent=`${largo}cm x ${ancho}cm x ${alto}cm - ${litros}L - Agua ${nivelAgua}%`;
  document.getElementById('contador').textContent=objetos.length+' objetos';
  let counts={};objetos.forEach(o=>{counts[o.userData.tipo]=(counts[o.userData.tipo]||0)+1;});
  document.getElementById('lista').innerHTML='<b>En tu urna:</b><br>'+(Object.entries(counts).map(([k,v])=>`${k} x${v}`).join(' • ')||'Vacía');
  let rec=alto<=30?6:alto<=40?8:alto<=50?10:12;let a='';
  if(grosor>=rec)a+=`<div class="ok">✅ CORRECTO: ${grosor}mm es seguro para ${alto}cm.</div>`;else a+=`<div class="bad">🚨 PELIGRO: Con ${alto}cm necesitas ${rec}mm mínimo.</div>`;
  if(largo>90)a+=`<div class="warn">⚠️ TIRANTE OBLIGATORIO: Largo ${largo}cm > 90cm.</div>`;
  document.getElementById('avisos').innerHTML=a||`<div class="ok">✅ Montaje seguro</div>`;
  document.getElementById('ficha').innerHTML=`<li>Frontal/Trasero: 2x ${largo} x ${alto} cm</li><li>Laterales: 2x ${(ancho-grosor*2/10).toFixed(1)} x ${alto} cm</li><li>Base: 1x ${largo} x ${ancho} cm</li><li>Silicona: ${litros<=100?1:litros<=250?2:3} tubo(s)</li><li>Tirantes: ${largo>90?'1x '+(ancho-2)+' x 8cm':'No necesita'}</li>`;
  if(urna){dibujarUrna();}
}
document.getElementById('largo').addEventListener('input',e=>{largo=+e.target.value;dibujarUrna();dibujarArena();dibujarAgua();actualizar();});
document.getElementById('ancho').addEventListener('input',e=>{ancho=+e.target.value;dibujarUrna();dibujarArena();dibujarAgua();actualizar();});
document.getElementById('alto').addEventListener('input',e=>{alto=+e.target.value;dibujarUrna();dibujarAgua();actualizar();});
abrir('agua',document.querySelector('#menu button'));
init();actualizar();
addRoca('Dragon',0x777777);addPlanta('Anubia',0x1a7a2a);addPez('Guppy',0xff7b00);
</script>
</body>
</html>
