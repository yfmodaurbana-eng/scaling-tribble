<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acuario Designer V3.0</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <h1>🐠 Acuario Designer V3.0</h1>

    <div class="top-buttons">
        <button>Nuevo</button>
        <button>Guardar</button>
        <button>Exportar</button>
    </div>

</header>


<main class="workspace">


<!-- PANEL DE HERRAMIENTAS -->

<aside class="tools">

<h2>Herramientas</h2>


<button class="tool">
🪨 Añadir roca
</button>


<button class="tool">
🌱 Añadir planta
</button>


<button class="tool">
🐟 Añadir pez
</button>


<button class="tool">
💡 Iluminación
</button>


<button class="tool">
💧 Parámetros agua
</button>


<hr>


<h3>Medidas</h3>


<label>
Largo (cm)
<input type="number" value="70">
</label>


<label>
Ancho (cm)
<input type="number" value="30">
</label>


<label>
Alto (cm)
<input type="number" value="40">
</label>


<button class="create">
Crear acuario
</button>


</aside>




<!-- ZONA SIMULADOR -->

<section class="simulation">


<div id="aquarium">


<div class="water">

</div>


<div class="substrate">

</div>


</div>


<div class="camera-controls">

<button>+</button>
<button>-</button>
<button>🔄</button>

</div>


</section>




<!-- PANEL INFORMACIÓN -->


<aside class="info">

<h2>Información</h2>


<div class="card">

<h3>Acuario</h3>

<p>
Capacidad:
<span id="liters">
84 L
</span>
</p>


<p>
Cristal:
6 mm
</p>


</div>



<div class="card">

<h3>Agua</h3>

<p>
pH:
7.0
</p>


<p>
Temperatura:
25 ºC
</p>


<p>
NO3:
20 mg/L
</p>

</div>


</aside>



</main>



<footer>

Acuario Designer © 2026

</footer>



<script src="js/engine.js"></script>
<script src="js/objects.js"></script>
</body>

</html>
