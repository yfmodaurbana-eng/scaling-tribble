<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUARIO ONLINE - Monta tu acuario en 3D</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<header>
  <div class="logo">🐠 AQUARIO <span>ONLINE</span></div>
  <button onclick="descargarFicha()">⬇ Descargar Ficha PDF</button>
</header>

<main>
  <!-- CENTRO 3D -->
  <section id="visor">
    <div id="canvas-3d"></div>
    <div class="vista-btns">
      <button onclick="cambiarVista('montaje')">Montaje</button>
      <button onclick="cambiarVista('real')">Llenar agua</button>
      <button onclick="limpiar()">Limpiar</button>
    </div>
  </section>

  <!-- PANEL DERECHO -->
  <aside>
    <div class="panel">
      <h2>PARAMETROS</h2>
      <label>Largo: <b id="v-largo">100 cm</b></label>
      <input type="range" id="largo" min="30" max="200" value="100">
      <label>Ancho: <b id="v-ancho">40 cm</b></label>
      <input type="range" id="ancho" min="25" max="80" value="40">
      <label>Alto: <b id="v-alto">40 cm</b></label>
      <input type="range" id="alto" min="25" max="80" value="40">
      <label>Grosor cristal:</label>
      <div class="grosores">
        <button onclick="setGrosor(6)">6mm</button>
        <button onclick="setGrosor(8)" class="active">8mm</button>
        <button onclick="setGrosor(10)">10mm</button>
        <button onclick="setGrosor(12)">12mm</button>
      </div>
      <div class="litros">💧 <span id="litros">160 L</span><small id="peso">Peso total ~180 kg</small></div>
    </div>

    <div class="panel diagnostico">
      <h2>DIAGNOSTICO</h2>
      <div id="avisos"></div>
      <h3>Ficha de cortes:</h3>
      <ul id="ficha"></ul>
    </div>
  </aside>
</main>

<!-- BARRA CONSTRUCCION -->
<footer>
  <span>CONSTRUCCIÓN</span>
  <button onclick="addItem('pez')">🐟 Peces</button>
  <button onclick="addItem('planta')">🌿 Plantas</button>
  <button onclick="addItem('roca')">🪨 Rocas</button>
  <button onclick="addItem('tronco')">🪵 Troncos</button>
  <button onclick="addItem('equipo')">⚙️ Equipo</button>
</footer>

<script src="app.js"></script>
</body>
</html>
