<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acuario Designer Studio V5</title>

<link rel="stylesheet" href="./css/style.css">

</head>


<body>


<div class="app">


<header class="header">


<div class="logo">

🐠 ACUARIO DESIGNER

<span>
STUDIO V5
</span>

</div>


<div class="actions">

<button>
Nuevo
</button>

<button>
Guardar
</button>

<button>
Exportar
</button>

</div>


</header>





<main class="main">



<!-- PANEL IZQUIERDO -->

<aside class="sidebar">


<h2>
🛠 Herramientas
</h2>



<div class="tools">


<button>
🪨
<br>
Roca
</button>


<button>
🌱
<br>
Planta
</button>


<button>
🐟
<br>
Pez
</button>


<button>
💡
<br>
Luz
</button>


</div>





<div class="panel-box">


<h3>
📐 Diseño
</h3>



<label>

Largo

<input id="largo" value="70">

cm

</label>




<label>

Ancho

<input id="ancho" value="30">

cm

</label>





<label>

Alto

<input id="alto" value="40">

cm

</label>





<select id="montaje">


<option value="interior">
Base interior
</option>


<option value="exterior">
Base exterior
</option>


</select>



</div>



</aside>









<!-- ACUARIO 3D -->


<section class="viewer">


<div class="aquarium">


<div class="water">
</div>


<div class="sand">
</div>


<div class="rock">
</div>


</div>





<div class="camera">


<button>
+
</button>


<button>
-
</button>


<button>
⟳
</button>


</div>



</section>









<!-- PANEL DERECHO -->


<aside class="panel">


<h2>
📊 Información
</h2>




<div class="card">


<h3>
🐠 Acuario
</h3>


<p id="infoLitros">
84 litros
</p>


<p id="infoMedidas">
70×30×40 cm
</p>


</div>






<div class="card">


<h3>
🛡 Seguridad
</h3>


<p id="estadoSeguridad">
🟢 Diseño correcto
</p>


</div>







<div class="card">


<h3>
📋 Ficha técnica
</h3>


<p>
Cristal:
<span id="infoCristal">
6 mm
</span>
</p>


<p>
Peso:
<span id="pesoTotal">
0 kg
</span>
</p>


<p>
Tirantes:
<span id="tirantes">
No necesarios
</span>
</p>


</div>




</aside>




</main>



</div>





<script src="./js/engine.js"></script>


</body>

</html>
