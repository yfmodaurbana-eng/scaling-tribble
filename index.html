<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acuario Designer Studio</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


<header class="header">

<div class="logo">
🐠 Acuario Designer
<span>STUDIO PRO</span>
</div>

<button>
⚙️ Opciones
</button>

</header>



<main class="main">



<!-- IZQUIERDA -->

<aside class="panel">

<h2>🛠 Diseño</h2>


<label>
Largo
<input id="largo" value="70">
cm
</label>


<label>
Ancho
<input id="ancho" value="30">
cm
</label>


<label>
Alto
<input id="alto" value="40">
cm
</label>



<h3>Montaje</h3>


<select id="montaje">

<option value="interior">
Base interior
</option>


<option value="exterior">
Base exterior
</option>


</select>



<button id="crearAcuario">

🏗 Crear acuario

</button>



</aside>





<!-- CENTRO -->

<section class="visor">


<div class="aquarium">


<div class="water"></div>

<div class="sand"></div>


</div>


</section>





<!-- DERECHA -->


<aside class="panel">


<h2>📊 Información</h2>


<div class="card">

Volumen:

<b id="litros">
0 L
</b>


<br><br>


Cristal:

<b id="cristal">
-
</b>


<br><br>


Medidas:

<b id="medidas">
-
</b>


</div>





<div class="card">


<h3>
🛡 Seguridad
</h3>


<div id="seguridad">

Esperando...

</div>


</div>





<div class="card">


<h3>
📋 Ficha fabricación
</h3>


<pre id="fichaTecnica">

Sin generar

</pre>



</div>



</aside>



</main>



</div>





<script src="js/engine.js"></script>

<script src="js/ficha.js"></script>


</body>

</html>
