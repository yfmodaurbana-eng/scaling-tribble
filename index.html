<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Acuario Designer Studio PRO
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


<header class="topbar">


<div class="logo">

🐠 Acuario Designer

<span>PRO V9</span>

</div>


<div class="top-actions">

<button>
Nuevo
</button>

<button>
Guardar
</button>

<button>
Exportar
</button>


</div>


</header>





<main class="workspace">



<!-- PANEL IZQUIERDO -->

<aside class="left-panel">


<h2>
🛠 Herramientas
</h2>


<button class="tool">
🪨 Roca
</button>


<button class="tool">
🌱 Planta
</button>


<button class="tool">
🐟 Pez
</button>


<button class="tool">
💡 Luz
</button>



<h2>
📐 Dimensiones
</h2>



<label>
Largo
<input id="largo" value="70">
</label>


<label>
Ancho
<input id="ancho" value="30">
</label>


<label>
Alto
<input id="alto" value="40">
</label>



<button id="crearAcuario" class="create">

Crear acuario

</button>


</aside>





<!-- VISOR CENTRAL -->

<section class="viewer">


<div class="scene">


<div class="placeholder">

🐠

<br>

VISOR 3D

<br>

PROXIMAMENTE

</div>


</div>


</section>







<!-- PANEL DERECHO -->


<aside class="right-panel">


<h2>
📊 Inspector
</h2>



<div class="card">


<h3>
Acuario
</h3>


<p>
Volumen:

<strong id="litros">

0 L

</strong>

</p>


<p>
Cristal:

<strong id="cristal">

-

</strong>

</p>



</div>






<div class="card">


<h3>
Ficha técnica
</h3>


<div id="fichaTecnica">

Sin diseño generado

</div>


</div>





<div class="card">


<h3>
Seguridad
</h3>


<div id="seguridad">

Esperando datos

</div>


</div>




</aside>



</main>



<footer>

Acuario Designer Studio PRO © 2026

</footer>



</div>



<script src="js/app.js"></script>

<script src="js/ui.js"></script>

<script src="js/engine.js"></script>

<script src="js/ficha.js"></script>

<script src="js/render3d.js"></script>


</body>

</html>
